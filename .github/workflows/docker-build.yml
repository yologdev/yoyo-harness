name: Build and Push Docker Image

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'  # Weekly rebuild (Mondays) to pick up yoyo-evolve updates
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: yoyo-evolve

      - name: Download yoyo identity
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          mkdir -p identity
          YOYO_EVOLVE_DIR="/tmp/yoyo-evolve"
          mkdir -p "$YOYO_EVOLVE_DIR"

          if gh api "repos/yologdev/yoyo-evolve/tarball/main" > /tmp/yoyo-evolve.tar.gz 2>/dev/null; then
              tar xzf /tmp/yoyo-evolve.tar.gz -C "$YOYO_EVOLVE_DIR" --strip-components=1
              rm -f /tmp/yoyo-evolve.tar.gz

              if [ -f "$YOYO_EVOLVE_DIR/scripts/yoyo_context.sh" ]; then
                  YOYO_REPO="$YOYO_EVOLVE_DIR" source "$YOYO_EVOLVE_DIR/scripts/yoyo_context.sh"
                  echo "$YOYO_CONTEXT" > "identity/SOUL.md"
                  echo "Identity built ($(wc -l < identity/SOUL.md) lines)"
              else
                  echo "WARNING: yoyo_context.sh not found"
                  echo "# Identity not available at build time" > identity/SOUL.md
              fi

              rm -rf "$YOYO_EVOLVE_DIR"
          else
              echo "WARNING: Failed to download yoyo-evolve"
              echo "# Identity not available at build time" > identity/SOUL.md
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/yologdev/yoyo-harness:latest
            ghcr.io/yologdev/yoyo-harness:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
